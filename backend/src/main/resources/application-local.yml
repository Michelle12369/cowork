# 本機開發 profile（IntelliJ Run Config → Active profiles: local）
# 只放非機密設定；secrets 一律留在 gitignored 的 .env.local（由下方 import 載入）。
# MUST 是 .env.local 而非 .env——.env 是 docker compose 專用（值為容器內視角，例如
# LANGFUSE_HOST=http://lf-web:3000、ERD_AGENT_ANALYSIS_BASE_URL=http://deepagent-service:8000），
# 本機直跑吃到那組會連不上。
spring:
  config:
    # 兩個路徑都 optional：IntelliJ 工作目錄可能是 repo 根或 backend/，哪個存在就載哪個
    import: "optional:file:.env.local[.properties],optional:file:../.env.local[.properties]"
  h2:
    console:
      enabled: true
      # http://localhost:8080/h2-console；JDBC URL 填 jdbc:h2:mem:local（user: sa / password 空白）
      path: /h2-console
