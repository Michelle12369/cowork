spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:local;MODE=Oracle;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 5120MB
server:
  port: 8080
tsso:
  # true=身分由 internal 側同層 filter 提供,主線 CurrentUserFilter 不註冊;預設 false 走 X-User-Id。
  enabled: ${TSSO_ENABLED:false}
erd:
  storage:
    local-dir: ${ERD_STORAGE_LOCAL_DIR:./data/files}
    workspace-dir: ${ERD_STORAGE_WORKSPACE_DIR:./data/workspace}
    cleanup:
      cron: ${ERD_STORAGE_CLEANUP_CRON:0 0 3 * * *}
      dry-run: ${ERD_STORAGE_CLEANUP_DRY_RUN:false}
    retention:
      uploads: ${ERD_STORAGE_RETENTION_UPLOADS:180d}
      workspace: ${ERD_STORAGE_RETENTION_WORKSPACE:180d}
      artifact: ${ERD_STORAGE_RETENTION_ARTIFACT:730d}
  upload:
    max-files: 5
    max-session-bytes: 5368709120   # 5GB
    max-csv-bytes: 2147483648       # 2GB
    max-xlsx-bytes: 209715200       # 200MB
    sample-rows: ${ERD_UPLOAD_SAMPLE_ROWS:20}  # 上傳時擷取樣本列數——prompt 樣本的唯一來源
    # internal 環境的上傳檔為加密檔，需在落地前呼叫內部 API 解密。
    # true 時 MUST 另外提供一個 UploadDecryptor 實作 bean；未設或 false 走 passthrough。
    decryption:
      enabled: ${ERD_UPLOAD_DECRYPTION_ENABLED:false}
  artifact:
    rewrite:
      current-profile: tw3-ec5
      profiles:
        tw3-ec5:
          - pattern: "https://cdn\\.tailwindcss\\.com[^\"']*"
            replacement: /vendor/tailwind-play-v3.js
          - pattern: "https://cdn\\.jsdelivr\\.net/npm/echarts@5[^\"']*"
            replacement: /vendor/echarts-v5.min.js
  agent:
    provider: ${ERD_AGENT_PROVIDER:openai-compatible}
    analysis:
      base-url: ${ERD_AGENT_ANALYSIS_BASE_URL:http://localhost:8000}
      source-root: ${ERD_AGENT_ANALYSIS_SOURCE_ROOT:../backend/data/files}
      request-timeout-seconds: ${ERD_AGENT_ANALYSIS_REQUEST_TIMEOUT_SECONDS:180}
      max-in-memory-size-mb: ${ERD_AGENT_ANALYSIS_MAX_IN_MEMORY_SIZE_MB:64}
    open-ai-compatible:
      base-url: ${ERD_AGENT_OPENAI_COMPATIBLE_BASE_URL:}
      api-key: ${ERD_AGENT_OPENAI_COMPATIBLE_API_KEY:}
      model: ${ERD_AGENT_OPENAI_COMPATIBLE_MODEL:gpt-oss-120b}
      context-window: ${ERD_AGENT_OPENAI_COMPATIBLE_CONTEXT_WINDOW:131072}
      chat-completions-path: ${ERD_AGENT_OPENAI_COMPATIBLE_CHAT_PATH:/v1/chat/completions}
      auth-mode: ${ERD_AGENT_OPENAI_COMPATIBLE_AUTH_MODE:bearer}
      token-exchange:
        url: ${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_EXCHANGE_URL:}
        service-account-key: ${ERD_AGENT_OPENAI_COMPATIBLE_SERVICE_ACCOUNT_KEY:}
        service-account-key-file: ${ERD_AGENT_OPENAI_COMPATIBLE_SERVICE_ACCOUNT_KEY_FILE:}
        header-name: ${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_HEADER:}
        token-ttl-seconds: ${ERD_AGENT_OPENAI_COMPATIBLE_TOKEN_TTL:300}
    repair:
      enabled: ${ERD_AGENT_REPAIR_ENABLED:true}
