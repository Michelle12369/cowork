server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # 不可加尾斜線：/api prefix 必須原樣轉給 backend（其 mapping 以 /api 開頭）
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;           # SSE 必須
    proxy_read_timeout 300s;       # 涵蓋較長生成等待（analysis/deepagent provider）
    client_max_body_size 5g;       # 放行大檔上傳（5GB session 上限），實際額度由後端把關
    proxy_request_buffering off;    # 串流上傳，不在 nginx 緩衝整個 body
  }

  location /fonts/ {
    add_header Access-Control-Allow-Origin *;
    try_files $uri =404;
  }

  location /vendor/ {
    add_header Access-Control-Allow-Origin *;
    try_files $uri =404;
  }

  # Hashed build assets: content-addressed filenames → safe to cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    # index.html must revalidate every load, otherwise deploys leave browsers
    # on the old bundle (hashed asset names change but the cached shell doesn't)
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
