<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>銷售分析儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5"></script>
</head>
<body class="bg-slate-50">

<header class="bg-slate-800 text-white px-8 py-5">
  <div class="max-w-7xl mx-auto flex items-end justify-between">
    <div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg bg-blue-600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
        </span>
        <h1 class="text-2xl font-semibold tracking-tight">銷售分析儀表板</h1>
      </div>
      <p class="text-slate-300 text-sm mt-1">即時銷售數據分析（區域與期間可調整）</p>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-8 py-6">

  <!-- section: controls -->
  <div class="flex items-center gap-6 mb-6">
    <div>
      <label for="select-regions" class="text-sm font-medium text-slate-600 block mb-1">區域</label>
      <select id="select-regions" multiple size="4" disabled
        class="text-sm border border-slate-300 rounded-lg px-2 py-1 min-w-48 bg-white">
        <option disabled>載入區域中…</option>
      </select>
    </div>
    <div>
      <label for="select-days" class="text-sm font-medium text-slate-600 block mb-1">期間</label>
      <select id="select-days" class="text-sm border border-slate-300 rounded-lg px-2 py-1">
        <option value="7">近 7 日</option>
        <option value="30" selected>近 30 日</option>
        <option value="90">近 90 日</option>
      </select>
    </div>
  </div>

  <!-- section: insight -->
  <div class="bg-amber-50 border border-amber-200 border-l-4 border-l-amber-400 rounded-lg p-4 text-sm text-amber-900 mb-6">
    <span class="inline-flex items-center gap-1.5 font-semibold">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5c-.6.5-1 1.2-1 2v.5H9v-.5c0-.8-.4-1.5-1-2A6 6 0 0 1 12 3z"/></svg>
      自動洞察：</span>
    <span id="insight-text">載入中…</span>
  </div>

  <!-- section: kpi -->
  <section class="grid grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 border-l-4 border-l-blue-500">
      <p class="text-xs text-slate-500 font-medium">總營收</p>
      <p class="text-2xl font-semibold text-slate-800 mt-1" id="kpi-revenue">…</p>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 border-l-4 border-l-emerald-500">
      <p class="text-xs text-slate-500 font-medium">訂單筆數</p>
      <p class="text-2xl font-semibold text-slate-800 mt-1" id="kpi-orders">…</p>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 border-l-4 border-l-cyan-500">
      <p class="text-xs text-slate-500 font-medium">平均訂單金額</p>
      <p class="text-2xl font-semibold text-slate-800 mt-1" id="kpi-avg">…</p>
    </div>
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 border-l-4 border-l-rose-500">
      <p class="text-xs text-slate-500 font-medium">總出貨量</p>
      <p class="text-2xl font-semibold text-slate-800 mt-1" id="kpi-qty">…</p>
    </div>
  </section>

  <!-- section: charts -->
  <section class="grid grid-cols-2 gap-4 mb-6">
    <!-- revenue trend -->
    <div id="card-revenue-trend" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">每日營收趨勢</h3>
      <p data-slot="loading" class="text-sm text-slate-400">載入中…</p>
      <p data-slot="error" class="hidden text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
      <div data-slot="content" class="hidden"><div id="chart-revenue-trend" class="h-72"></div></div>
    </div>
    <!-- region comparison -->
    <div id="card-region-compare" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">各區域營收比較</h3>
      <p data-slot="loading" class="text-sm text-slate-400">載入中…</p>
      <p data-slot="error" class="hidden text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
      <div data-slot="content" class="hidden"><div id="chart-region-compare" class="h-72"></div></div>
    </div>
  </section>

  <section class="grid grid-cols-2 gap-4 mb-6">
    <!-- top products -->
    <div id="card-top-products" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">Top 10 產品營收</h3>
      <p data-slot="loading" class="text-sm text-slate-400">載入中…</p>
      <p data-slot="error" class="hidden text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
      <div data-slot="content" class="hidden"><div id="chart-top-products" class="h-72"></div></div>
    </div>
    <!-- defect breakdown -->
    <div id="card-defect" class="bg-white rounded-xl border border-slate-200 shadow-sm p-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">瑕疵類型分佈</h3>
      <p data-slot="loading" class="text-sm text-slate-400">載入中…</p>
      <p data-slot="error" class="hidden text-sm text-rose-700 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
      <div data-slot="content" class="hidden"><div id="chart-defect" class="h-72"></div></div>
    </div>
  </section>

</main>

<script>
// ---- helpers ----
function byId(id) {
  const el = document.getElementById(id);
  if (!el) throw new Error('[ERD] no element with id "' + id + '"');
  return el;
}

function setCardState(card, state, message) {
  card.querySelector('[data-slot=loading]').classList.toggle('hidden', state !== 'loading');
  const errorSlot = card.querySelector('[data-slot=error]');
  errorSlot.classList.toggle('hidden', state !== 'error');
  errorSlot.textContent = state === 'error' ? String(message) : '';
  card.querySelector('[data-slot=content]').classList.toggle('hidden', state !== 'content');
}

const fmt = v => {
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (Number.isInteger(n)) return n.toLocaleString();
  const abs = Math.abs(n);
  return (abs !== 0 && abs < 0.01) ? n.toPrecision(3) : n.toFixed(2);
};

const fmtCurrency = v => {
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

function col(row, name) {
  if (!(name in row)) throw new Error('[ERD] no column "' + name + '" in row');
  return row[name];
}

// ---- state ----
let regionNames = new Map();
let trendChart = null;
let regionChart = null;
let productChart = null;
let defectChart = null;
let requestId = 0;

// ---- region options ----
mcp('sales', 'list_regions', {}, r => {
  const select = byId('select-regions');
  if (r.error) {
    console.warn('[ERD] sales/list_regions failed:', r.error.message);
    select.innerHTML = '<option disabled>區域載入失敗</option>';
    return;
  }
  try {
    const rows = r.data;
    rows.forEach(row => {
      const id = String(col(row, 'region'));
      const name = String(col(row, 'display_name'));
      regionNames.set(id, name);
    });
    select.innerHTML = rows.map(row =>
      '<option value="' + escapeHtml(col(row, 'region')) + '">' + escapeHtml(col(row, 'display_name')) + '</option>'
    ).join('');
    select.disabled = false;
    select.addEventListener('change', loadData);
  } catch (error) {
    console.error('[ERD] regions select failed:', error);
    select.innerHTML = '<option disabled>區域載入失敗</option>';
    setTimeout(() => { throw error; }, 0);
  }
});

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---- main load ----
function loadData() {
  const select = byId('select-regions');
  const daysSelect = byId('select-days');
  const regions = [...select.selectedOptions].map(o => String(o.value));
  const days = Number(daysSelect.value);

  if (regions.length === 0) {
    setKpiEmpty();
    byId('insight-text').textContent = '請選擇至少一個區域';
    return;
  }

  const currentId = ++requestId;
  select.disabled = true;
  daysSelect.disabled = true;

  // Orders call (regions filtered client-side to avoid platform array serialization issue)
  mcp('sales', 'list_orders', { days: days }, r => {
    if (r.error) {
      console.warn('[ERD] sales/list_orders failed:', r.error.message);
      setKpiEmpty();
      byId('insight-text').textContent = '訂單資料載入失敗：' + r.error.message;
      select.disabled = false;
      daysSelect.disabled = false;
      return;
    }
    try {
      let orderRows = r.data;
      // Client-side region filter
      if (regions.length > 0) {
        orderRows = orderRows.filter(row => regions.includes(String(col(row, 'region'))));
      }
      if (orderRows.length === 0) {
        setKpiEmpty();
        byId('insight-text').textContent = '（所選條件無訂單資料）';
        select.disabled = false;
        daysSelect.disabled = false;
        return;
      }

      // KPI
      renderKpi(orderRows);

      // Insight
      renderInsight(orderRows);

      // Fan-out: trend + region + products from orderRows, defect from defect_summary
      renderTrendChart(orderRows);
      renderRegionChart(orderRows);
      renderProductChart(orderRows);

      // Defect call
      mcp('sales', 'defect_summary', { days: days }, r2 => {
        if (r2.error) {
          console.warn('[ERD] sales/defect_summary failed:', r2.error.message);
          setCardState(byId('card-defect'), 'error', r2.error.message);
        } else {
          try {
            const defectRows = r2.data;
            if (defectRows.length === 0) {
              setCardState(byId('card-defect'), 'error', '（無瑕疵資料）');
            } else {
              setCardState(byId('card-defect'), 'content');
              renderDefectChart(defectRows);
            }
          } catch (err) {
            console.error('[ERD] defect render failed:', err);
            setCardState(byId('card-defect'), 'error', '圖表載入失敗');
            setTimeout(() => { throw err; }, 0);
          }
        }
        if (currentId === requestId) {
          select.disabled = false;
          daysSelect.disabled = false;
        }
      });
    } catch (error) {
      console.error('[ERD] order render failed:', error);
      setKpiEmpty();
      byId('insight-text').textContent = '圖表載入失敗';
      select.disabled = false;
      daysSelect.disabled = false;
      setTimeout(() => { throw error; }, 0);
    }
  });
}

function setKpiEmpty() {
  byId('kpi-revenue').textContent = '—';
  byId('kpi-orders').textContent = '—';
  byId('kpi-avg').textContent = '—';
  byId('kpi-qty').textContent = '—';
}

// ---- KPI ----
function renderKpi(rows) {
  let totalRevenue = 0, totalQty = 0;
  for (const row of rows) {
    totalRevenue += Number(col(row, 'amount'));
    totalQty += Number(col(row, 'quantity'));
  }
  const orderCount = rows.length;
  const avg = orderCount > 0 ? totalRevenue / orderCount : 0;

  byId('kpi-revenue').textContent = fmtCurrency(totalRevenue);
  byId('kpi-orders').textContent = fmt(orderCount);
  byId('kpi-avg').textContent = fmtCurrency(avg);
  byId('kpi-qty').textContent = fmt(totalQty);
}

// ---- Insight ----
function renderInsight(rows) {
  let totalRevenue = 0, totalQty = 0;
  const regionMap = new Map();
  for (const row of rows) {
    totalRevenue += Number(col(row, 'amount'));
    totalQty += Number(col(row, 'quantity'));
    const r = String(col(row, 'region'));
    regionMap.set(r, (regionMap.get(r) || 0) + Number(col(row, 'amount')));
  }
  const orderCount = rows.length;
  const avg = orderCount > 0 ? totalRevenue / orderCount : 0;

  // Find top region
  let topRegion = '', topRev = 0;
  for (const [rid, rev] of regionMap) {
    if (rev > topRev) { topRev = rev; topRegion = rid; }
  }
  const topRegionName = regionNames.get(topRegion) || topRegion;

  // Find top product
  const prodMap = new Map();
  for (const row of rows) {
    const p = String(col(row, 'product'));
    prodMap.set(p, (prodMap.get(p) || 0) + Number(col(row, 'amount')));
  }
  let topProd = '', topProdRev = 0;
  for (const [p, rev] of prodMap) {
    if (rev > topProdRev) { topProdRev = rev; topProd = p; }
  }

  const insight = `總營收 ${fmtCurrency(totalRevenue)}，共 ${fmt(orderCount)} 筆訂單，平均訂單金額 ${fmtCurrency(avg)}。表現最佳區域為「${topRegionName}」（${fmtCurrency(topRev)}），主力產品為「${topProd}」。`;
  byId('insight-text').textContent = insight;
}

// ---- Revenue Trend (line) ----
function renderTrendChart(rows) {
  const dailyMap = new Map();
  for (const row of rows) {
    const d = String(col(row, 'order_date'));
    dailyMap.set(d, (dailyMap.get(d) || 0) + Number(col(row, 'amount')));
  }
  const sorted = [...dailyMap.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const dates = sorted.map(e => e[0]);
  const values = sorted.map(e => e[1]);

  if (!trendChart) {
    trendChart = echarts.init(byId('chart-revenue-trend'), 'erd');
    window.addEventListener('resize', () => trendChart.resize());
  }
  setCardState(byId('card-revenue-trend'), 'content');
  trendChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => fmtCurrency(v) },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: {
      type: 'category',
      data: dates,
      axisLabel: { formatter: v => String(v).substring(5) }
    },
    yAxis: {
      type: 'value',
      axisLabel: { formatter: v => '$' + fmt(v) }
    },
    series: [{
      type: 'line',
      data: values,
      smooth: true,
      areaStyle: { opacity: 0.15 }
    }]
  }, true);
}

// ---- Region Comparison (bar) ----
function renderRegionChart(rows) {
  const regionMap = new Map();
  for (const row of rows) {
    const r = String(col(row, 'region'));
    regionMap.set(r, (regionMap.get(r) || 0) + Number(col(row, 'amount')));
  }
  const entries = [...regionMap.entries()].sort((a, b) => b[1] - a[1]);
  const labels = entries.map(e => regionNames.get(e[0]) || e[0]);
  const values = entries.map(e => e[1]);

  if (!regionChart) {
    regionChart = echarts.init(byId('chart-region-compare'), 'erd');
    window.addEventListener('resize', () => regionChart.resize());
  }
  setCardState(byId('card-region-compare'), 'content');
  regionChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => fmtCurrency(v) },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: {
      type: 'category',
      data: labels,
      axisLabel: { rotate: 15 }
    },
    yAxis: {
      type: 'value',
      axisLabel: { formatter: v => '$' + fmt(v) }
    },
    series: [{
      type: 'bar',
      data: values,
      label: { show: true, position: 'top', formatter: v => fmtCurrency(v.value) }
    }]
  }, true);
}

// ---- Top Products (horizontal bar) ----
function renderProductChart(rows) {
  const prodMap = new Map();
  for (const row of rows) {
    const p = String(col(row, 'product'));
    prodMap.set(p, (prodMap.get(p) || 0) + Number(col(row, 'amount')));
  }
  const sorted = [...prodMap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
  const labels = sorted.map(e => e[0]);
  const values = sorted.map(e => e[1]);

  if (!productChart) {
    productChart = echarts.init(byId('chart-top-products'), 'erd');
    window.addEventListener('resize', () => productChart.resize());
  }
  setCardState(byId('card-top-products'), 'content');
  productChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => fmtCurrency(v) },
    grid: { left: '3%', right: '10%', bottom: '3%', containLabel: true },
    xAxis: {
      type: 'value',
      axisLabel: { formatter: v => '$' + fmt(v) }
    },
    yAxis: {
      type: 'category',
      data: labels,
      axisLabel: { fontSize: 11 }
    },
    series: [{
      type: 'bar',
      data: values,
      label: { show: true, position: 'right', formatter: v => fmtCurrency(v.value) }
    }]
  }, true);
}

// ---- Defect Breakdown (pie) ----
function renderDefectChart(rows) {
  const data = rows.map(r => ({
    name: String(col(r, 'defect_type')),
    value: Number(col(r, 'count'))
  }));

  if (!defectChart) {
    defectChart = echarts.init(byId('chart-defect'), 'erd');
    window.addEventListener('resize', () => defectChart.resize());
  }
  setCardState(byId('card-defect'), 'content');
  defectChart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: p => p.name + '<br/>數量：' + fmt(p.value) + '（' + p.percent + '%）'
    },
    legend: { top: 5 },
    series: [{
      type: 'pie',
      radius: ['40%', '70%'],
      avoidLabelOverlap: true,
      itemStyle: { borderRadius: 6 },
      label: { show: true, formatter: '{b}: {d}%' },
      data: data
    }]
  }, true);
}

// ---- initial load ----
document.addEventListener('DOMContentLoaded', () => {
  // Trigger initial data load once regions are populated
  // The region select's change listener handles it, but on first open
  // we need to fire it manually after options are loaded
  // We'll do this by checking if select has options
  const select = byId('select-regions');
  const checkAndLoad = () => {
    if (select.options.length > 1) {
      select.dispatchEvent(new Event('change'));
    } else {
      setTimeout(checkAndLoad, 200);
    }
  };
  checkAndLoad();
});
</script>

</body>
</html>
