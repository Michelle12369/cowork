<!DOCTYPE html>
<html lang="zh-Hant">
<head><script id="erd-mcp-runtime" data-erd-runtime="1">
(function () {
  var nextCallId = 1;
  var pendingHandlersById = {};

  window.mcp = function (connectorName, toolName, toolArgs, handler) {
    var callId = String(nextCallId++);
    pendingHandlersById[callId] = handler;
    var args = JSON.parse(JSON.stringify(toolArgs === undefined ? {} : toolArgs));
    parent.postMessage({ type: 'erd-mcp-call', id: callId, connector: connectorName, tool: toolName, args: args }, '*');
  };

  window.addEventListener('message', function (messageEvent) {
    if (messageEvent.source !== parent) return; // 只有 host 頁面本身能回答, 不接其他來源.
    var message = messageEvent.data;
    if (!message || message.type !== 'erd-mcp-result') return;
    var handler = pendingHandlersById[message.id];
    if (!handler) return;
    delete pendingHandlersById[message.id];
    var result = message.result;
    if (result && result.error && (result.error.code === 'TOOL_ERROR' || result.error.code === 'INVALID_CALL')) {
      parent.postMessage({ type: 'erd-artifact-error', errors: [{ message: 'mcp ' + result.error.code + ': ' + String(result.error.message).slice(0, 500), line: 0, col: 0 }] }, '*');
    }
    handler(result);
  });
})();</script>

<script id="erd-results-data">window.__ERD_RESULTS__ = {};
(function(){
  var PROBE_PASS = {toJSON:1, then:1};
  Object.keys(window.__ERD_RESULTS__).forEach(function(queryId){
    var result = window.__ERD_RESULTS__[queryId];
    var columns = result.columns || [];
    result.rows = (result.rows || []).map(function(row){
      return new Proxy(row, {
        get: function(target, prop, receiver){
          if (typeof prop === 'symbol' || prop in target || PROBE_PASS[prop]) {
            return Reflect.get(target, prop, receiver);
          }
          throw new Error('[ERD] ' + queryId + ' row has no column "' + String(prop) +
            '"; available columns: ' + columns.join(', '));
        }
      });
    });
  });
})();</script></head>

<script>
// ---- helpers ----
const fmt = v => {
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (Number.isInteger(n)) return n.toLocaleString();
  const abs = Math.abs(n);
  return (abs !== 0 && abs < 0.01) ? n.toPrecision(3) : n.toFixed(2);
};

const escapeHtml = s => String(s).replace(/[&<>"']/g, ch =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

function byId(id) {
  const el = document.getElementById(id);
  if (!el) throw new Error('[ERD] no element with id "' + id + '"');
  return el;
}

function col(row, name) {
  if (!(name in row)) throw new Error('[ERD] no column "' + name + '" in row');
  return row[name];
}

function setCardState(card, state, message) {
  card.querySelector('[data-slot=loading]').classList.toggle('hidden', state !== 'loading');
  const errorSlot = card.querySelector('[data-slot=error]');
  errorSlot.classList.toggle('hidden', state !== 'error');
  errorSlot.textContent = state === 'error' ? String(message) : '';
  card.querySelector('[data-slot=content]').classList.toggle('hidden', state !== 'content');
}

function showCardError(card, message, retryFn) {
  setCardState(card, 'error', message);
  const retryButton = card.querySelector('[data-slot=retry]');
  retryButton.classList.toggle('hidden', !retryFn);
  retryButton.onclick = retryFn;
}

function showAuthBanner(message) {
  let banner = document.getElementById('erd-auth-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'erd-auth-banner';
    banner.className = 'bg-rose-600 text-white text-sm text-center px-4 py-2';
    document.body.prepend(banner);
  }
  banner.textContent = message;
}

function showTab(idx) {
  document.querySelectorAll('[role=tab]').forEach((tabButton, index) => {
    tabButton.className = 'inline-flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 transition-all ' +
      (index === idx ? 'border-blue-600 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-800');
    document.getElementById('panel-' + index).classList.toggle('hidden', index !== idx);
  });
  window.dispatchEvent(new Event('resize'));
}

// ---- transform functions ----
function computeKpi(rows) {
  let revenue = 0, orderCount = 0;
  const products = new Set();
  for (const row of rows) {
    revenue += Number(col(row, 'amount'));
    orderCount++;
    products.add(String(col(row, 'product')));
  }
  return { revenue, orderCount, productCount: products.size };
}

function summarizeDailyRevenue(rows) {
  const acc = new Map();
  for (const row of rows) {
    const day = String(col(row, 'order_date')).substring(0, 10);
    acc.set(day, (acc.get(day) || 0) + Number(col(row, 'amount')));
  }
  return [...acc.entries()].sort();
}

function summarizeTopProducts(rows) {
  const acc = new Map();
  for (const row of rows) {
    const product = String(col(row, 'product'));
    const entry = acc.get(product) || { revenue: 0, qty: 0 };
    entry.revenue += Number(col(row, 'amount'));
    entry.qty += Number(col(row, 'quantity'));
    acc.set(product, entry);
  }
  return [...acc.entries()]
    .map(([product, entry]) => ({ product, revenue: entry.revenue, qty: entry.qty }))
    .sort((a, b) => b.revenue - a.revenue);
}

function summarizeRegionRevenue(rows) {
  const acc = new Map();
  for (const row of rows) {
    const region = String(col(row, 'region'));
    acc.set(region, (acc.get(region) || 0) + Number(col(row, 'amount')));
  }
  return [...acc.entries()]
    .map(([region, revenue]) => ({ region, revenue }))
    .sort((a, b) => b.revenue - a.revenue);
}

// ---- chart instances (init once, setOption on update) ----
let topProductsChart = null;
let regionCompareChart = null;
let revenueTrendChart = null;
let defectChart = null;

// ---- render functions ----
function renderTopProducts(items) {
  const names = items.map(i => i.product);
  const values = items.map(i => i.revenue);
  if (!topProductsChart) {
    topProductsChart = echarts.init(byId('chart-top-products'), 'erd');
    window.addEventListener('resize', () => topProductsChart.resize());
  }
  topProductsChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => '$' + fmt(v) },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'value', axisLabel: { formatter: '${value}' } },
    yAxis: { type: 'category', data: names, axisLabel: { interval: 0 } },
    series: [{ type: 'bar', data: values, label: { show: true, position: 'right', formatter: p => '$' + fmt(p.value) } }]
  }, true);
}

function renderRegionCompare(items) {
  const names = items.map(i => i.region);
  const values = items.map(i => i.revenue);
  if (!regionCompareChart) {
    regionCompareChart = echarts.init(byId('chart-region-compare'), 'erd');
    window.addEventListener('resize', () => regionCompareChart.resize());
  }
  regionCompareChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: v => '$' + fmt(v) },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', data: names },
    yAxis: { type: 'value', axisLabel: { formatter: '${value}' } },
    series: [{ type: 'bar', data: values, label: { show: true, position: 'top', formatter: p => '$' + fmt(p.value) } }]
  }, true);
}

function renderRevenueTrend(points) {
  const values = points.map(p => p[1]);
  const dataMin = Math.min(...values), dataMax = Math.max(...values);
  const margin = (dataMax - dataMin) * 0.1 || 1;
  if (!revenueTrendChart) {
    revenueTrendChart = echarts.init(byId('chart-revenue-trend'), 'erd');
    window.addEventListener('resize', () => revenueTrendChart.resize());
  }
  revenueTrendChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '$' + fmt(v) },
    grid: { left: '3%', right: '4%', bottom: 60, containLabel: true },
    xAxis: { type: 'time', axisLabel: { formatter: value => echarts.format.formatTime('MM-dd', value) } },
    yAxis: { type: 'value', min: Math.max(0, Math.floor(dataMin - margin)), max: Math.ceil(dataMax + margin), axisLabel: { formatter: '${value}' } },
    dataZoom: [{ type: 'inside' }, { type: 'slider', height: 20, bottom: 5 }],
    series: [{ type: 'line', data: points, showSymbol: false, smooth: true, areaStyle: { opacity: 0.15 } }]
  }, true);
}

function renderDefectChart(items) {
  if (!defectChart) {
    defectChart = echarts.init(byId('chart-defect'), 'erd');
    window.addEventListener('resize', () => defectChart.resize());
  }
  defectChart.setOption({
    tooltip: { trigger: 'item', formatter: p => p.name + '<br/>數量: ' + fmt(p.value) + '<br/>佔比: ' + p.percent + '%' },
    legend: { top: 5 },
    series: [{
      type: 'pie', radius: ['45%', '70%'], center: ['50%', '56%'],
      label: { formatter: '{b}: {c} ({d}%)' },
      data: items.map(item => ({ name: String(col(item, 'defect_type')), value: Number(col(item, 'count')) }))
    }]
  }, true);
}

function renderDetailTable({ headId, bodyId, columns, rows }) {
  byId(headId).innerHTML = `<tr>${columns.map(name => `<th class="py-2 pr-4">${escapeHtml(name)}</th>`).join('')}</tr>`;
  byId(bodyId).innerHTML = rows.map(row =>
    `<tr>${columns.map(name => `<td class="py-2 pr-4">${col(row, name) == null ? '' : escapeHtml(fmt(col(row, name)))}</td>`).join('')}</tr>`
  ).join('');
}

// ---- region names lookup (filled by list_regions) ----
const regionNames = new Map();   // region id → display_name

// ---- load regions (populate multi-select, then trigger initial loads) ----
function loadRegions() {
  const select = byId('select-regions');
  select.disabled = true;
  select.innerHTML = '<option disabled>載入區域中…</option>';
  mcp('sales', 'list_regions', {}, handleRegionsResponse);
}
const retryRegions = loadRegions;

function handleRegionsResponse(r) {
  const select = byId('select-regions');
  if (r.error) {
    console.warn('[ERD] sales/list_regions failed:', r.error.message);
    select.innerHTML = '<option disabled>區域載入失敗</option>';
    if (r.error.code === 'AUTH') { showAuthBanner(r.error.message); return; }
    return;
  }
  try {
    const regionRows = r.data.result;
    regionRows.forEach(row => regionNames.set(String(col(row, 'region')), String(col(row, 'display_name'))));
    select.innerHTML = regionRows.map(row =>
      `<option value="${escapeHtml(col(row, 'region'))}">${escapeHtml(col(row, 'display_name'))}</option>`
    ).join('');
    // pre-select all
    for (const opt of select.options) opt.selected = true;
    select.disabled = false;
    select.addEventListener('change', loadOrders);
    // initial loads after regions are ready
    loadOrders();
    loadDefectSummary();
  } catch (error) {
    console.error('[ERD] regions select failed:', error);
    select.innerHTML = '<option disabled>區域載入失敗</option>';
    setTimeout(() => { throw error; }, 0);
  }
}

// ---- Data set 1: orders (drives KPI, top products, region comparison, revenue trend, detail table) ----
let ordersRequestId = 0;
const retryOrders = loadOrders;

function loadOrders() {
  const select = byId('select-regions');
  const daysSelect = byId('select-days');
  const regions = [...select.selectedOptions].map(opt => String(opt.value));
  const days = Number(daysSelect.value);

  const cards = [byId('card-top-products'), byId('card-region-compare'), byId('card-revenue-trend'), byId('card-detail')];
  if (regions.length === 0) {
    cards.forEach(card => showCardError(card, '請至少選擇一個區域', null));
    byId('kpi-revenue').textContent = '—';
    byId('kpi-orders').textContent = '—';
    byId('kpi-products').textContent = '—';
    byId('insight-text').textContent = '請選擇區域以查看分析。';
    return;
  }

  const requestId = ++ordersRequestId;
  const finish = () => { select.disabled = false; daysSelect.disabled = false; };
  select.disabled = true;
  daysSelect.disabled = true;
  cards.forEach(card => setCardState(card, 'loading'));
  byId('insight-text').textContent = '載入中…';

  mcp('sales', 'list_orders', { regions: regions, days: days }, r => {
    if (requestId !== ordersRequestId) return;
    if (r.error) {
      console.warn('[ERD] sales/list_orders failed:', r.error.message);
      if (r.error.code === 'AUTH') {
        showAuthBanner(r.error.message);
      } else {
        const cardRetry = r.error.code === 'RETRYABLE' ? retryOrders : null;
        cards.forEach(card => showCardError(card, r.error.message, cardRetry));
      }
      byId('kpi-revenue').textContent = '—';
      byId('kpi-orders').textContent = '—';
      byId('kpi-products').textContent = '—';
      byId('insight-text').textContent = '資料載入失敗';
      finish(); return;
    }
    try {
      const rows = r.data.result;
      if (rows.length === 0) {
        cards.forEach(card => showCardError(card, '（所選條件無訂單資料）', null));
        byId('kpi-revenue').textContent = '—';
        byId('kpi-orders').textContent = '—';
        byId('kpi-products').textContent = '—';
        byId('insight-text').textContent = '所選區域與期間內無訂單。';
        finish(); return;
      }

      const kpi = computeKpi(rows);
      const topProducts = summarizeTopProducts(rows);
      const regionRevenue = summarizeRegionRevenue(rows);
      const dailyRevenue = summarizeDailyRevenue(rows);
      const topProduct = topProducts[0];
      const topRegion = regionRevenue[0];

      // KPI
      byId('kpi-revenue').textContent = '$' + fmt(kpi.revenue);
      byId('kpi-orders').textContent = fmt(kpi.orderCount);
      byId('kpi-products').textContent = fmt(kpi.productCount);

      // insight
      const regionLabel = regionNames.get(topRegion.region) || topRegion.region;
      const prodLabel = topProduct.product;
      byId('insight-text').textContent =
        `近 ${days} 日所選區域中，${regionLabel} 營收最高（$${fmt(topRegion.revenue)}），` +
        `以 ${prodLabel} 為最暢銷產品（$${fmt(topProduct.revenue)}）。` +
        (dailyRevenue.length > 1
          ? ` 期間共 ${fmt(kpi.orderCount)} 筆訂單，總營收 $${fmt(kpi.revenue)}。`
          : '');

      // Charts
      setCardState(byId('card-revenue-trend'), 'content');
      renderRevenueTrend(dailyRevenue);
      setCardState(byId('card-top-products'), 'content');
      renderTopProducts(topProducts);
      setCardState(byId('card-region-compare'), 'content');
      renderRegionCompare(regionRevenue);

      // Detail table
      setCardState(byId('card-detail'), 'content');
      renderDetailTable({
        headId: 'detail-table-head', bodyId: 'detail-table-body',
        columns: ['order_id', 'order_date', 'region', 'product', 'quantity', 'unit_price', 'amount', 'status'],
        rows
      });

      finish();
    } catch (error) {
      console.error('[ERD] orders cards failed:', error);
      cards.forEach(card => showCardError(card, '圖表載入失敗', null));
      finish();
      setTimeout(() => { throw error; }, 0);
    }
  });
}

// ---- Data set 2: defect summary (only depends on days, not regions) ----
let defectRequestId = 0;
const retryDefect = loadDefectSummary;

function loadDefectSummary() {
  const days = Number(byId('select-days').value);
  const card = byId('card-defect');
  const requestId = ++defectRequestId;
  setCardState(card, 'loading');

  mcp('sales', 'defect_summary', { days: days }, r => {
    if (requestId !== defectRequestId) return;
    if (r.error) {
      console.warn('[ERD] sales/defect_summary failed:', r.error.message);
      if (r.error.code === 'AUTH') { showAuthBanner(r.error.message); return; }
      showCardError(card, r.error.message, r.error.code === 'RETRYABLE' ? retryDefect : null);
      return;
    }
    try {
      const items = r.data.result;
      if (items.length === 0) { showCardError(card, '（無資料）', null); return; }
      setCardState(card, 'content');
      renderDefectChart(items);
    } catch (error) {
      console.error('[ERD] defect card failed:', error);
      showCardError(card, '圖表載入失敗', null);
      setTimeout(() => { throw error; }, 0);
    }
  });
}

// ---- startup ----
document.addEventListener('DOMContentLoaded', () => {
  showTab(0);
  byId('select-days').addEventListener('change', () => {
    loadOrders();
    loadDefectSummary();
  });
  loadRegions();
});
</script>
